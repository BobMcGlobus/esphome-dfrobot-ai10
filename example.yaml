# Example ESPHome configuration for DFRobot SEN0677 AI Binocular Vision Sensor
#
# This component supports:
#   - Face recognition & enrollment
#   - Palm vein recognition & enrollment
#   - QR code scanning
#   - User management (add/delete)
#
# Wiring (ESP32-S3 example):
#   SEN0677 VCC → 5V (NOT 3.3V!)
#   SEN0677 GND → GND
#   SEN0677 TX  → ESP RX pin (GPIO34 in this example)
#   SEN0677 RX  → ESP TX pin (GPIO33 in this example)

esphome:
  name: ai-vision-sensor
  friendly_name: AI Vision Sensor

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Load the external component
external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG

api:
  services:
    # Enroll a new user (hold face or palm in front of sensor)
    - service: ai_enroll_user
      variables:
        user_name: string
        is_admin: bool
      then:
        - lambda: |-
            uint8_t admin = is_admin ? 1 : 0;
            id(ai10_sensor)->enroll_user(admin, user_name.c_str(), 10);

    # Delete a specific user by UID
    - service: ai_delete_user
      variables:
        uid: int
      then:
        - lambda: |-
            id(ai10_sensor)->delete_user(uid);

    # Start recognition with custom timeout
    - service: ai_start_recognition
      variables:
        timeout: int
        continuous: bool
      then:
        - lambda: |-
            id(ai10_sensor)->start_recognition(timeout, continuous);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


# ===== UART for SEN0677 =====
uart:
  id: uart_ai10
  tx_pin: GPIO33    # ESP TX → Sensor RX
  rx_pin: GPIO34    # ESP RX → Sensor TX
  baud_rate: 115200 # Fixed, cannot be changed


# ===== SEN0677 Component with Triggers =====
dfrobot_ai10:
  id: ai10_sensor
  uart_id: uart_ai10

  # Fires when a registered face or palm is recognized
  on_recognized:
    then:
      - lambda: |-
          // 'name' and 'uid' are provided by the trigger
          auto type = id(ai10_sensor)->get_last_type();
          std::string type_str = "face";
          if (type == esphome::dfrobot_ai10::TYPE_PALM) type_str = "palm";

          ESP_LOGI("ai10", "Authorized: %s (UID %d, %s)", name.c_str(), uid, type_str.c_str());
      - text_sensor.template.publish:
          id: ai_recognized_user
          state: !lambda 'return name;'
      - sensor.template.publish:
          id: ai_recognized_uid
          state: !lambda 'return uid;'
      - binary_sensor.template.publish:
          id: ai_authorized
          state: true
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "authorized"
      # Auto-reset after 30 seconds
      - delay: 30s
      - binary_sensor.template.publish:
          id: ai_authorized
          state: false
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "idle"

  # Fires when a QR code is successfully scanned
  on_qr_scanned:
    then:
      - text_sensor.template.publish:
          id: ai_qr_code
          state: !lambda 'return qr_data;'
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "qr_scanned"
      - logger.log:
          format: "QR Code scanned: %s"
          args: [ 'qr_data.c_str()' ]


# ===== Buttons (appear in HA as pressable buttons) =====
button:
  # Start face/palm recognition (continuous, 30s timeout)
  - platform: template
    name: "AI Start Recognition"
    icon: "mdi:face-recognition"
    on_press:
      - lambda: id(ai10_sensor)->start_recognition(30, true);
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "scanning"

  # Stop any running operation
  - platform: template
    name: "AI Stop Recognition"
    icon: "mdi:stop-circle-outline"
    on_press:
      - lambda: id(ai10_sensor)->send_reset();
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "idle"
      - binary_sensor.template.publish:
          id: ai_face_detected
          state: false
      - binary_sensor.template.publish:
          id: ai_authorized
          state: false

  # Scan QR code (15s timeout)
  - platform: template
    name: "AI Scan QR Code"
    icon: "mdi:qrcode-scan"
    on_press:
      - lambda: id(ai10_sensor)->scan_qr_code(15);
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "scanning_qr"

  # Query registered user count
  - platform: template
    name: "AI Get User List"
    icon: "mdi:account-multiple"
    on_press:
      - lambda: id(ai10_sensor)->get_all_user_ids();

  # Delete ALL registered users (use with caution!)
  - platform: template
    name: "AI Delete All Users"
    icon: "mdi:account-multiple-remove"
    on_press:
      - lambda: id(ai10_sensor)->delete_all_users();

  # Reset sensor
  - platform: template
    name: "AI Sensor Reset"
    icon: "mdi:restart"
    on_press:
      - lambda: id(ai10_sensor)->send_reset();
      - text_sensor.template.publish:
          id: ai_recognition_state
          state: "idle"


# ===== Interval: poll face_detected status =====
interval:
  - interval: 500ms
    then:
      - lambda: |-
          bool face = id(ai10_sensor)->is_face_detected();
          if (id(ai_face_detected).state != face)
            id(ai_face_detected).publish_state(face);


# ===== Text Sensors =====
text_sensor:
  - platform: template
    id: ai_recognition_state
    name: "AI Recognition State"
    icon: "mdi:eye"

  - platform: template
    id: ai_recognized_user
    name: "AI Recognized User"
    icon: "mdi:account"

  - platform: template
    id: ai_qr_code
    name: "AI QR Code"
    icon: "mdi:qrcode"


# ===== Sensors =====
sensor:
  - platform: template
    id: ai_recognized_uid
    name: "AI Recognized UID"
    icon: "mdi:identifier"
    accuracy_decimals: 0

  - platform: template
    id: ai_user_count
    name: "AI User Count"
    icon: "mdi:account-group"
    accuracy_decimals: 0
    lambda: |-
      return id(ai10_sensor)->get_user_count();
    update_interval: 60s


# ===== Binary Sensors =====
binary_sensor:
  - platform: template
    id: ai_face_detected
    name: "AI Face Detected"
    device_class: occupancy
    icon: "mdi:face-man"

  - platform: template
    id: ai_authorized
    name: "AI Authorized"
    device_class: lock
    icon: "mdi:shield-check"